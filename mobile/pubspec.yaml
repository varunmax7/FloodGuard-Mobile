name: floodguard
description: "FloodGuard: Real-time urban flood alert system for Hyderabad"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.20.5

  # ── Navigation ────────────────────────────────────────────────────────────────
  go_router: ^14.3.0

  # ── Networking ────────────────────────────────────────────────────────────────
  dio: ^5.7.0
  retrofit: ^4.4.1
  json_annotation: ^4.9.0

  # ── Local database / offline ──────────────────────────────────────────────────
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.27
  path_provider: ^2.1.4
  path: ^1.9.0

  # ── Maps ──────────────────────────────────────────────────────────────────────
  maplibre_gl: ^0.21.0

  # ── Firebase ──────────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3

  # ── Location ──────────────────────────────────────────────────────────────────
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # ── Media ────────────────────────────────────────────────────────────────────
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0

  # ── Background sync ───────────────────────────────────────────────────────────
  workmanager: ^0.5.2

  # ── UI ────────────────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0

  # ── Utilities ─────────────────────────────────────────────────────────────────
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.5.1
  logger: ^2.4.0
  connectivity_plus: ^6.0.3
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  retrofit_generator: ^9.1.5
  json_serializable: ^6.8.0
  drift_dev: ^2.21.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
