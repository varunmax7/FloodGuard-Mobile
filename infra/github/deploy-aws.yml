name: Deploy to AWS

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: production
        type: choice
        options: [production, staging]
      image_tag:
        description: Image tag to deploy (leave blank to build from HEAD)
        required: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: floodguard
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Build & push to ECR ───────────────────────────────────────────────────
  build-push:
    name: Build & Push to ECR
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      ecr_uri: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve image tag
        id: meta
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          else
            echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.meta.outputs.tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-to: type=inline

  # ── Deploy to ECS ─────────────────────────────────────────────────────────
  deploy:
    name: Update ECS Services
    runs-on: ubuntu-latest
    needs: build-push
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve environment name
        id: env
        run: echo "name=${{ inputs.environment || 'production' }}" >> $GITHUB_OUTPUT

      - name: Update web task definition
        id: web-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: floodguard-web-${{ steps.env.outputs.name }}
          container-name: web
          image: ${{ needs.build-push.outputs.ecr_uri }}:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy web service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.web-taskdef.outputs.task-definition }}
          service: floodguard-web-${{ steps.env.outputs.name }}
          cluster: floodguard-${{ steps.env.outputs.name }}
          wait-for-service-stability: true
          codedeploy-appspec: ""

      - name: Update worker task definition
        id: worker-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: floodguard-worker-${{ steps.env.outputs.name }}
          container-name: worker
          image: ${{ needs.build-push.outputs.ecr_uri }}:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy worker service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-taskdef.outputs.task-definition }}
          service: floodguard-worker-${{ steps.env.outputs.name }}
          cluster: floodguard-${{ steps.env.outputs.name }}
          wait-for-service-stability: false

      - name: Update beat task definition
        id: beat-taskdef
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition-family: floodguard-beat-${{ steps.env.outputs.name }}
          container-name: beat
          image: ${{ needs.build-push.outputs.ecr_uri }}:${{ needs.build-push.outputs.image_tag }}

      - name: Deploy beat service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.beat-taskdef.outputs.task-definition }}
          service: floodguard-beat-${{ steps.env.outputs.name }}
          cluster: floodguard-${{ steps.env.outputs.name }}
          wait-for-service-stability: false

      - name: Print API URL
        run: |
          ALB=$(aws cloudformation describe-stacks \
            --stack-name "floodguard-${{ steps.env.outputs.name }}" \
            --query "Stacks[0].Outputs[?OutputKey=='ALBDnsName'].OutputValue" \
            --output text)
          echo "### Deployed to AWS" >> $GITHUB_STEP_SUMMARY
          echo "- **Image tag:** \`${{ needs.build-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL:** $ALB" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ steps.env.outputs.name }}" >> $GITHUB_STEP_SUMMARY

  # ── Build & upload admin to S3 (optional) ────────────────────────────────
  deploy-admin:
    name: Deploy Admin Dashboard to S3
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.ADMIN_BUCKET_NAME != '' }}
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Build admin dashboard
        working-directory: admin
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_MAPLIBRE_STYLE_URL: ${{ vars.MAPLIBRE_STYLE_URL || 'https://demotiles.maplibre.org/style.json' }}

      - name: Sync admin dist to S3
        run: |
          aws s3 sync admin/dist/ s3://${{ vars.ADMIN_BUCKET_NAME }}/ \
            --delete \
            --cache-control "no-cache" \
            --exclude "assets/*"
          aws s3 sync admin/dist/assets/ s3://${{ vars.ADMIN_BUCKET_NAME }}/assets/ \
            --cache-control "public,max-age=31536000,immutable"
